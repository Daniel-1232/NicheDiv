name: ClimateNAr cross-platform test

on:
  push:
    branches:
      - climatena-crossplatform-test
    paths:
      - "R/install_nichediv_dependencies.R"
      - "R/NicheDiv-functions.R"
      - "tests/crossplatform/**"
      - ".github/workflows/climatena-crossplatform.yml"

permissions:
  contents: read

jobs:
  climateNA:
    name: ClimateNA on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - macos-15-intel

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install NicheDiv dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::pkgload

      - name: Test ClimateNAr installation and NicheDiv extraction
        shell: Rscript {0}
        run: |
          source("tests/crossplatform/test_climatena.R")

