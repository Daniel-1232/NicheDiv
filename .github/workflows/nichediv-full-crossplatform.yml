name: NicheDiv full cross-platform validation

on:
  workflow_dispatch:
  push:
    branches:
      - climatena-crossplatform-test
    paths:
      - "R/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - "tests/**"
      - ".github/workflows/nichediv-full-crossplatform.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Full NicheDiv tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - macos-15-intel
          - windows-2025

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install NicheDiv dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          install-pandoc: 'false'
          extra-packages: |
            any::pkgload
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown

      - name: Install ClimateNAr 3.2.0 for package check
        shell: Rscript {0}
        run: |
          source("R/install_nichediv_dependencies.R")
          install_nichediv_dependencies(
            install_climatena = TRUE,
            install_whitebox = FALSE,
            install_data_table = FALSE,
            timeout = 1800,
            force = FALSE,
            verbose = TRUE
          )
          if (as.character(utils::packageVersion("ClimateNAr")) != "3.2.0") stop("Incorrect ClimateNAr version")

      - name: R CMD check whole package
        uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"warning"'
          upload-snapshots: false

      - name: ClimateNA download and full occurrence comparison
        shell: Rscript {0}
        run: |
          source("tests/crossplatform/test_climatena.R")

      - name: Exercise all exported NicheDiv functions
        shell: Rscript {0}
        run: |
          source("tests/crossplatform/test_all_functions.R")

      - name: Test native parallel backends
        shell: Rscript {0}
        run: |
          source("tests/crossplatform/test_parallel_backends.R")

      - name: Test background generation with synthetic landmask and raster
        shell: Rscript {0}
        run: |
          source("tests/crossplatform/test_background.R")

      - name: Verify complete exported function coverage
        shell: Rscript {0}
        run: |
          pkgload::load_all(".", quiet = TRUE)
          report_files <- list.files("tests/crossplatform/results", pattern = "^all_functions_.*[.]csv$", full.names = TRUE)
          if (length(report_files) != 1L) stop("Expected exactly one function report")
          report <- read.csv(report_files, stringsAsFactors = FALSE)
          if (nrow(report) != 18L) stop("Expected 18 exported-function entries")
          if (!setequal(report$function_name, getNamespaceExports("NicheDiv"))) stop("Incomplete exported-function coverage")
          direct <- report$function_name != "extract.env.and.background"
          if (!all(report$status[direct] == "PASS")) stop("At least one direct function test did not pass")
          if (!identical(report$status[!direct], "SEPARATE")) stop("Extraction integration test was not recorded")
          print(report[, c("function_name", "status")], row.names = FALSE)
          message("PASS: All 18 exported functions accounted for")

      - name: Upload function test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: function-test-report-${{ matrix.os }}
          path: tests/crossplatform/results/*.csv
          if-no-files-found: ignore
